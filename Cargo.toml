[workspace]
resolver = "3"
members = ["crates/fileseal-core", "crates/fileseal-cli", "src-tauri"]

[workspace.package]
version = "2.6.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
fileseal-core = { path = "crates/fileseal-core" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"

# Hashing is unbearably slow unoptimised: optimise the hash crates even in
# debug builds, so `tauri dev` and tests run at a realistic speed.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3
